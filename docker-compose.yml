version: '3.8'

services:
  # Example: Valheim dedicated server
  valheim:
    build: .
    image: steam-box64:latest
    container_name: valheim-server
    environment:
      # Valheim specific settings
      - SERVER_NAME=My Valheim Server
      - WORLD_NAME=Dedicated
      - SERVER_PASS=secret
      - SERVER_PUBLIC=0
    volumes:
      # Mount game server data
      - ./valheim-data:/home/steam/valheim-server
      - ./valheim-config:/home/steam/.config/unity3d/IronGate/Valheim
    ports:
      # Valheim ports
      - "2456:2456/udp"
      - "2457:2457/udp"
      - "2458:2458/udp"
    restart: unless-stopped
    tty: true
    stdin_open: true
    # Uncomment to run Valheim server on startup
    # command: ["/usr/local/bin/start-valheim.sh"]
    profiles:
      - valheim

  # Example: Palworld dedicated server
  palworld:
    build: .
    image: steam-box64:latest
    container_name: palworld-server
    environment:
      # Palworld specific settings
      - SERVER_NAME=My Palworld Server
      - SERVER_DESC=A Palworld Dedicated Server
      - SERVER_PASSWORD=secret
      - ADMIN_PASSWORD=adminpass
      - MAX_PLAYERS=32
      - SERVER_PORT=8211
      - PUBLIC_PORT=8211
    volumes:
      # Mount game server data
      - ./palworld-data:/home/steam/palworld-server
      - ./palworld-config:/home/steam/.steam/steam/steamapps/common/PalServer
    ports:
      # Palworld ports
      - "8211:8211/udp"
      - "27015:27015/udp"
    restart: unless-stopped
    tty: true
    stdin_open: true
    # Uncomment to run Palworld server on startup
    # command: ["/usr/local/bin/start-palworld.sh"]
    profiles:
      - palworld

  # Generic SteamCMD + Box64 container (default)
  steam-box64:
    build: .
    image: steam-box64:latest
    container_name: steam-box64
    volumes:
      # Mount directory for game servers
      - ./game-servers:/home/steam/servers
      # Mount SteamCMD directory to persist downloads
      - ./steamcmd:/home/steam/steamcmd
    ports:
      # Common game server ports - adjust as needed
      - "27015-27020:27015-27020/tcp"
      - "27015-27020:27015-27020/udp"
    restart: unless-stopped
    tty: true
    stdin_open: true
    profiles:
      - default

networks:
  default:
    driver: bridge
