services:
  # Generic SteamCMD + Box64 container (default)
  valheim-server:
    build:
      context: .
      args:
        USER_UID: 1001
    image: valheim-box64-server:latest
    user: "1001"
    environment:
      # Valheim Dedicated Server AppID
      - GAME_APP_ID=896660
      # Valheim server executable relative to GAME_SERVER_DIR
      - GAME_EXECUTABLE=valheim_server.x86_64
      # Update mount volume paths as needed
      - GAME_SAVE_DIR=/home/steam/valheim-save
      - GAME_SERVER_DIR=/home/steam/server
      - STEAMCMD_DIR=/home/steam/steamcmd
    volumes:
      # Game server files
      - /mnt/data/server:/home/steam/server
      # Valheim save files
      - /mnt/data/valheim-save:/home/steam/valheim-save
      # SteamCMD files
      - /mnt/data/steamcmd:/home/steam/steamcmd
    ports:
      # Valheim uses UDP port 2456 (and adjacent ports); map primary UDP port
      - "2456-2457:2456-2457/udp"
    restart: unless-stopped
